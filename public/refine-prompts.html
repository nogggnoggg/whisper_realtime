<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>精譯指令管理 — 工廠雙語即時對話</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── Page shell ── */
    .rp-app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      background: var(--surface);
      border-left:  .5px solid var(--line);
      border-right: .5px solid var(--line);
    }

    /* ── Header ── */
    .gl-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      background: var(--panel);
      border-bottom: .5px solid var(--line);
      font-size: 13px;
    }
    .gl-brand {
      font-weight: 700;
      font-size: 14px;
    }
    .gl-sep { color: var(--hint); }
    .gl-back {
      margin-left: auto;
      color: var(--info-strong);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 600;
    }
    .gl-back:hover { text-decoration: underline; }

    /* ── Main content ── */
    .gl-content {
      flex: 1;
      padding: 20px 16px;
    }

    /* ── DB error banner ── */
    .db-error {
      display: none;
      background: var(--err-bg);
      color: var(--err-tx);
      border: .5px solid #e8c0c0;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 13.5px;
      font-weight: 500;
    }

    /* ── Section heading ── */
    .gl-section-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin: 0 0 10px;
    }

    /* ── Add row card ── */
    .add-card {
      background: var(--panel);
      border: .5px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 24px;
    }
    .add-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .add-col input[type="text"],
    .add-col textarea {
      padding: 7px 10px;
      border: .5px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      font-family: inherit;
    }
    .add-col input[type="text"] {
      width: 320px;
      max-width: 100%;
    }
    .add-col textarea {
      width: 100%;
      min-height: 80px;
      resize: vertical;
    }
    .add-col .btn-add {
      align-self: flex-start;
      padding: 7px 18px;
      background: var(--info-strong);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    .add-col .btn-add:hover   { background: #1571bf; }
    .add-col .btn-add:active  { background: #0e5aa0; }
    .add-col .btn-add:disabled {
      background: #c5c3ba;
      cursor: not-allowed;
    }

    /* ── Table ── */
    .gl-table-wrap {
      overflow-x: auto;
    }
    .gl-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    .gl-table th {
      text-align: left;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      background: var(--panel);
    }
    .gl-table td {
      padding: 9px 10px;
      border-bottom: .5px solid var(--line);
      vertical-align: middle;
    }
    .gl-table tr:last-child td { border-bottom: none; }
    .gl-table tr:hover td { background: rgba(0,0,0,.022); }

    /* Disabled row */
    .gl-table tr.row-inactive td:not(.td-actions) {
      opacity: .45;
    }

    /* Active pill */
    .status-pill {
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 8px;
    }
    .status-pill.active   { background: var(--ok-bg);  color: var(--ok-tx); }
    .status-pill.inactive { background: var(--panel);   color: var(--hint);  }

    /* Preview text */
    .preview-text {
      color: var(--muted);
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Inline edit inputs */
    .inline-input {
      padding: 4px 8px;
      border: 1.5px solid var(--info-strong);
      border-radius: 6px;
      font-size: 13.5px;
      font-family: inherit;
      width: 100%;
      min-width: 90px;
      background: #fff;
    }
    .inline-input:focus { outline: none; box-shadow: 0 0 0 2px rgba(24,95,165,.2); }
    .inline-textarea {
      padding: 4px 8px;
      border: 1.5px solid var(--info-strong);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      width: 100%;
      min-height: 72px;
      resize: vertical;
      background: #fff;
    }
    .inline-textarea:focus { outline: none; box-shadow: 0 0 0 2px rgba(24,95,165,.2); }

    /* Action buttons */
    .td-actions { white-space: nowrap; }
    .btn-sm {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      border: .5px solid var(--line);
      cursor: pointer;
      background: var(--surface);
      color: var(--text);
      transition: background .12s;
      margin-right: 4px;
    }
    .btn-sm:last-child { margin-right: 0; }
    .btn-sm:hover { background: var(--panel); }
    .btn-sm.btn-save {
      background: var(--ok-bg);
      color: var(--ok-tx);
      border-color: #9ee0c8;
    }
    .btn-sm.btn-save:hover { background: #c0edde; }
    .btn-sm.btn-cancel { color: var(--muted); }
    .btn-sm.btn-activate { color: var(--ok-tx); }

    /* ── Empty state ── */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 40px 20px;
      text-align: center;
      color: var(--hint);
    }
    .empty-state p {
      margin: 0;
      font-size: 14px;
    }

    /* ── Loading spinner ── */
    .loading-row td {
      text-align: center;
      color: var(--hint);
      font-style: italic;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="rp-app">

    <!-- Header -->
    <header class="gl-header">
      <span class="gl-brand">精譯指令管理</span>
      <span class="gl-sep">/</span>
      <span style="color:var(--muted);font-size:12.5px;">工廠雙語即時對話</span>
      <a class="gl-back" href="index.html">← 回主畫面</a>
    </header>

    <!-- Main content -->
    <main class="gl-content">

      <!-- DB error banner -->
      <div class="db-error" id="dbError">
        資料庫未連線（DATABASE_URL 未設定），精譯指令功能不可用。
      </div>

      <!-- Add prompt -->
      <p class="gl-section-title">新增精譯指令</p>
      <div class="add-card">
        <div class="add-col">
          <input type="text" id="addName" placeholder="指令名稱（例：標準精譯）" aria-label="指令名稱" />
          <textarea id="addPromptText" placeholder="指令內容（System prompt，用於 Route B 精準翻譯）" aria-label="指令內容"></textarea>
          <button class="btn-add" id="btnAdd" onclick="addPrompt()">新增</button>
        </div>
      </div>

      <!-- Prompts table -->
      <p class="gl-section-title">指令列表</p>
      <div class="gl-table-wrap">
        <table class="gl-table">
          <thead>
            <tr>
              <th style="width:160px">名稱</th>
              <th>指令預覽</th>
              <th style="width:80px">啟用中</th>
              <th style="width:180px">操作</th>
            </tr>
          </thead>
          <tbody id="promptsTbody">
            <tr class="loading-row"><td colspan="4">載入中…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Empty state -->
      <div class="empty-state" id="emptyState">
        <p>目前沒有精譯指令。請在上方新增第一筆。</p>
      </div>

    </main>
  </div>

  <script src="refine-prompts.js"></script>
</body>
</html>
